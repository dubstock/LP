<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Sheet Driven Gallery</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #fafafa;
      color: #222;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    .header-inner { padding: 10px 12px 6px; }
    .app-title { font-size: 20px; font-weight: 700; }

    .tabs {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      padding: 4px 8px 8px;
      gap: 8px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 0 0 auto;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      font-size: 14px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .page { padding: 8px; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ========== グリッド ========== */
    .grid {
      display: grid;
      gap: 2px;
      grid-auto-flow: dense;
      grid-template-columns: repeat(3, 1fr);
    }

    /* タブレット以上 */
    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* PC以上 */
    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    /* ========== サイズ指定（aspect-ratio方式） ========== */

    /* 1×1（正方形） */
    .grid-item.square,
    .grid-item:not(.tall):not(.wide):not(.big) {
      aspect-ratio: 1 / 1;
    }

    /* 1×2（縦長） */
    .grid-item.tall {
      grid-row: span 2;
      aspect-ratio: 1 / 2;
    }

    /* 2×1（横長） */
    .grid-item.wide {
      grid-column: span 2;
      aspect-ratio: 2 / 1;
    }

    /* 2×2（大きい） */
    .grid-item.big {
      grid-column: span 2;
      grid-row: span 2;
      aspect-ratio: 2 / 2;
    }

    /* ========== 共通アイテム ========== */
    .grid-item {
      position: relative;
      overflow: hidden;
      background: #eee;
      cursor: pointer;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== モーダル ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #000;
      color: #fff;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 820px;
      display: flex;
      flex-direction: column;
    }
    /* PCサイズのとき（1024px以上）はモーダルを大きく */
    @media (min-width: 1024px) {
      .modal {
        max-width: 1600px;
        max-height: 90vh;
      }
      .modal-image-wrap img {
        object-fit: contain;
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .modal-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      background: #000;
    }
    .modal-image-wrap img { width: 100%; display: block; }
    .modal-info {
      padding: 10px 12px 16px;
      background: #111;
    }
    .modal-meta {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
    }
    .modal-description {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* 画像下のタップで閉じるゾーン */
    .modal-tap-close-zone {
      height: 40px;
      background: transparent;
    }

    /* カルーセルボタン・ドット */
    .modal-image-wrap {
      position: relative;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0,0,0,0.4);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }

    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }

    .carousel-dot.active {
      background: #fff;
    }

    .footer {
      padding: 20px 12px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="app-title">Sheet Driven Gallery</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main class="page" id="panels"></main>

<footer class="footer">
  <div>© 2025 問い合わせ / URL</div>
</footer>

<!-- 詳細ビュー -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-image-wrap" id="modalImageWrap">
        <img src="" alt="" id="modalImage">
        <!-- 画像切り替えボタン -->
        <button class="carousel-btn prev" id="modalPrev">&#10094;</button>
        <button class="carousel-btn next" id="modalNext">&#10095;</button>
        <!-- 丸ぽち -->
        <div class="carousel-dots" id="modalDots"></div>
      </div>

      <!-- ここをタップで閉じるゾーン -->
      <div class="modal-tap-close-zone" id="modalTapClose"></div>

      <div class="modal-info">
        <div class="modal-meta" id="modalMeta"></div>
        <div class="modal-description" id="modalDesc"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // 拡張子自動判定（baseName = "101-1-01" など）
  async function resolveImagePath(baseName) {
    if (!baseName) return "";

    // 既に拡張子付き
    if (/\.(jpg|jpeg|png|webp|gif)$/i.test(baseName)) {
      const full = "./images/" + baseName;
      try {
        const res = await fetch(full, { method: "HEAD" });
        if (res.ok) return full;
      } catch (e) {}
      return "";
    }

    // 拡張子無し → 自動探索
    const exts = ["jpg", "jpeg", "png", "webp", "gif"];
    for (const ext of exts) {
      const full = `./images/${baseName}.${ext}`;
      try {
        const res = await fetch(full, { method: "HEAD" });
        if (res.ok) return full;
      } catch (e) {}
    }

    return "";
  }

  // ★ Meta（案件番号）から「番号-01, -02...」形式で画像を全部読む
  async function loadImagesByMeta(meta) {
    if (!meta) return [];

    const results = [];
    const maxImages = 50;

    for (let i = 1; i <= maxImages; i++) {
      const num = String(i).padStart(2, "0"); // 01, 02...
      const base = `${meta}-${num}`;          // 例: 101-1-01
      const url = await resolveImagePath(base);
      if (!url) {
        // 1枚目が無い → 画像無し
        if (i === 1) return [];
        // 途中で途切れた → そこで終了
        break;
      }
      results.push(url);
    }

    return results;
  }

  const SHEET_TSV_URL =
    "https://docs.google.com/spreadsheets/d/1rsHbHWmQDDoXfOwxllHl7YFvAkZeojIBLyzEISx7psQ/export?format=tsv&gid=651098947";

  let globalTabs = [];
  let currentTabIndex = 0;

  // モーダル用：複数画像
  let currentImages = [];
  let currentImageIndex = 0;

  async function init() {
    const url = SHEET_TSV_URL + "&t=" + Date.now();
    const res = await fetch(url, { cache: "no-cache" });
    const text = await res.text();

    const rows = text
      .trim()
      .split(/\r?\n/)
      .map(r => r.split("\t").map(c => c.trim()));

    const header = rows.shift();
    const idx = {};
    header.forEach((name, i) => {
      idx[name.trim()] = i;
    });

    const tabsMap = {};

    // for...of で await を安全に使う
    for (const r of rows) {
      const tabId    = r[idx["tabId"]];
      const tabLabel = r[idx["tabLabel"]];
      const title    = r[idx["title"]];
      const meta     = r[idx["meta"]];           // ← 案件番号として使用
      const desc     = r[idx["description"]];
      const size     = (r[idx["size"]] || "").trim();
      const status   = (r[idx["status"]] || "").trim();

      if (status !== "公開" || !tabId) continue;

      // ★ Meta（案件番号）から画像を全部ロード
      const imageUrls = await loadImagesByMeta(meta);

      if (!tabsMap[tabId]) {
        tabsMap[tabId] = { id: tabId, label: tabLabel, items: [] };
      }

      tabsMap[tabId].items.push({
        title,
        meta,
        description: desc,
        images: imageUrls,
        size: size || "square"
      });
    }

    const tabArray = Object.values(tabsMap);

    // おすすめタブ = 全部ミックス
    const allItems = tabArray.flatMap(t => t.items);
    globalTabs = [
      { id: "recommend", label: "おすすめ", items: allItems },
      ...tabArray
    ];

    buildUI(globalTabs);
    setupModal();
    setupSwipe();
  }

  function activateTab(index) {
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabPanels  = document.querySelectorAll(".tab-panel");
    if (!tabButtons.length || !tabPanels.length) return;
    if (index < 0 || index >= tabButtons.length) return;

    currentTabIndex = index;

    tabButtons.forEach((btn, i) => {
      btn.classList.toggle("active", i === index);
    });
    tabPanels.forEach((panel, i) => {
      panel.classList.toggle("active", i === index);
    });

    const activeBtn = tabButtons[index];
    const tabsEl = document.getElementById("tabs");
    if (activeBtn && tabsEl) {
      const btnRect = activeBtn.getBoundingClientRect();
      const tabsRect = tabsEl.getBoundingClientRect();
      const offset = btnRect.left - tabsRect.left - (tabsRect.width / 2) + (btnRect.width / 2);
      tabsEl.scrollLeft += offset;
    }
  }

  function buildUI(tabs) {
    const tabsEl   = document.getElementById("tabs");
    const panelsEl = document.getElementById("panels");
    tabsEl.innerHTML = "";
    panelsEl.innerHTML = "";

    tabs.forEach((tab, index) => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (index === 0 ? " active" : "");
      btn.dataset.tab = tab.id;
      btn.dataset.index = index;
      btn.textContent = tab.label || tab.id;
      tabsEl.appendChild(btn);

      const section = document.createElement("section");
      section.className = "tab-panel" + (index === 0 ? " active" : "");
      section.id = tab.id;
      section.dataset.index = index;

      const grid = document.createElement("div");
      grid.className = "grid";

      tab.items.forEach(item => {
        const cell = document.createElement("div");

        let baseClass = "grid-item";
        if (item.size === "tall") {
          baseClass += " tall";
        } else if (item.size === "wide") {
          baseClass += " wide";
        } else if (item.size === "big") {
          baseClass += " big";
        } else {
          baseClass += " square";
        }
        cell.className = baseClass;

        cell.dataset.title = item.title;
        cell.dataset.meta = item.meta;
        cell.dataset.description = item.description;
        cell.dataset.images = (item.images || []).join(",");

        const thumb = (item.images && item.images.length > 0) ? item.images[0] : "";
        if (thumb) {
          const img = document.createElement("img");
          img.src = thumb;
          img.alt = item.title || "";
          cell.appendChild(img);
        }

        grid.appendChild(cell);
      });

      section.appendChild(grid);
      panelsEl.appendChild(section);
    });

    const tabButtons = document.querySelectorAll(".tab-btn");
    tabButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.index || 0);
        activateTab(idx);
      });
    });

    currentTabIndex = 0;
  }

  function setupModal() {
    const modalOverlay = document.getElementById("modalOverlay");
    const modalImage   = document.getElementById("modalImage");
    const modalTitle   = document.getElementById("modalTitle");
    const modalMeta    = document.getElementById("modalMeta");
    const modalDesc    = document.getElementById("modalDesc");
    const modalClose   = document.getElementById("modalClose");
    const modalPrev    = document.getElementById("modalPrev");
    const modalNext    = document.getElementById("modalNext");
    const modalDots    = document.getElementById("modalDots");
    const modalImageWrap = document.getElementById("modalImageWrap");
    const modalTapClose  = document.getElementById("modalTapClose");

    function renderModalImage() {
      if (!currentImages.length) {
        modalImage.src = "";
        modalDots.innerHTML = "";
        return;
      }
      if (currentImageIndex < 0) currentImageIndex = 0;
      if (currentImageIndex >= currentImages.length) currentImageIndex = currentImages.length - 1;

      modalImage.src = currentImages[currentImageIndex];

      modalDots.innerHTML = "";
      currentImages.forEach((_, idx) => {
        const dot = document.createElement("div");
        dot.className = "carousel-dot" + (idx === currentImageIndex ? " active" : "");
        dot.addEventListener("click", () => {
          currentImageIndex = idx;
          renderModalImage();
        });
        modalDots.appendChild(dot);
      });

      const showNav = currentImages.length > 1;
      modalPrev.style.display = showNav ? "flex" : "none";
      modalNext.style.display = showNav ? "flex" : "none";
      modalDots.style.display = showNav ? "flex" : "none";
    }

    // グリッドクリック → モーダルオープン
    document.body.addEventListener("click", (e) => {
      const item = e.target.closest(".grid-item");
      if (!item) return;

      const imagesStr = item.dataset.images || "";
      const imgs = imagesStr.split(",").map(s => s.trim()).filter(Boolean);

      if (imgs.length === 0) {
        const thumbImg = item.querySelector("img");
        if (thumbImg) {
          currentImages = [thumbImg.src];
        } else {
          currentImages = [];
        }
      } else {
        currentImages = imgs;
      }
      currentImageIndex = 0;

      modalTitle.textContent = item.dataset.title || "";
      modalMeta.textContent  = item.dataset.meta || "";
      modalDesc.textContent  = item.dataset.description || "";

      renderModalImage();
      modalOverlay.classList.add("show");
    });

    modalClose.addEventListener("click", () => {
      modalOverlay.classList.remove("show");
    });

    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove("show");
      }
    });

    // 下側タップで閉じる
    if (modalTapClose) {
      modalTapClose.addEventListener("click", () => {
        modalOverlay.classList.remove("show");
      });
    }

    modalPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!currentImages.length) return;
      currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
      renderModalImage();
    });

    modalNext.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!currentImages.length) return;
      currentImageIndex = (currentImageIndex + 1) % currentImages.length;
      renderModalImage();
    });

    // 横スワイプで画像送り / 下スワイプで閉じる
    let startX = 0;
    let startY = 0;
    let endX = 0;
    let endY = 0;
    const SWIPE_X = 40;
    const SWIPE_Y = 80;

    modalImageWrap.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      endX = startX;
      endY = startY;
    });

    modalImageWrap.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      endX = t.clientX;
      endY = t.clientY;
    });

    modalImageWrap.addEventListener("touchend", () => {
      const dx = endX - startX;
      const dy = endY - startY;

      // 縦が大きい → 下スワイプなら閉じる
      if (Math.abs(dy) > Math.abs(dx)) {
        if (dy > SWIPE_Y) {
          modalOverlay.classList.remove("show");
        }
        return;
      }

      // 横スワイプで画像送り
      if (Math.abs(dx) < SWIPE_X) return;
      if (!currentImages.length) return;

      if (dx < 0) {
        currentImageIndex = (currentImageIndex + 1) % currentImages.length;
      } else {
        currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
      }
      renderModalImage();
    });
  }

  function setupSwipe() {
    const panels = document.getElementById("panels");
    if (!panels) return;

    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    const SWIPE_THRESHOLD = 50;

    panels.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchEndX = touchStartX;
      touchEndY = touchStartY;
    });

    panels.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      touchEndX = t.clientX;
      touchEndY = t.clientY;
    });

    panels.addEventListener("touchend", () => {
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;

      if (Math.abs(dy) > Math.abs(dx)) return;
      if (Math.abs(dx) < SWIPE_THRESHOLD) return;

      if (dx < 0) {
        const next = currentTabIndex + 1;
        if (next < globalTabs.length) {
          activateTab(next);
        }
      } else {
        const prev = currentTabIndex - 1;
        if (prev >= 0) {
          activateTab(prev);
        }
      }
    });
  }

  init();
</script>

</body>
</html>
