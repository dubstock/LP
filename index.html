<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Sheet Driven Gallery</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #fafafa;
      color: #222;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    .header-inner {
      padding: 8px 12px 6px;
    }

    /* タイトル＋サブタイトルを縦に並べる */
    .app-title-wrap {
      display: flex;
      flex-direction: column;
    }

    /* --- モバイル基準（スマホ） --- */
    .app-title {
      font-size: 25px;
      font-weight: 700;
      line-height: 1.2;
    }

    .app-subtitle {
      font-size: 15px;
      font-weight: 400;
      color: #666;
      margin-top: 2px;
    }

    /* --- PC向けにサイズアップ（768px以上）--- */
    @media (min-width: 768px) {
      .header-inner {
        padding: 12px 24px 8px;
      }

      .app-title {
        font-size: 40px;
      }

      .app-subtitle {
        font-size: 18px;
      }
    }

    /* --- 大きめディスプレイ（1024px以上）--- */
    @media (min-width: 1024px) {
      .app-title {
        font-size: 45px;
      }

      .app-subtitle {
        font-size: 20px;
      }
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      padding: 4px 8px 8px;
      gap: 20px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      position: relative;
      flex: 0 0 auto;
      padding: 10px 0 6px;
      border: none;
      background: transparent;
      font-size: 14px;
      cursor: pointer;
      color: #888;
      font-weight: 500;
    }
    @media (min-width: 1024px) {
      .tab-btn {font-size: 18px;}
    }

    /* アクティブなタブの文字色だけ強調 */
    .tab-btn.active {
      color: #111;          /* or #00c300 にするとLINEっぽい緑になる */
      font-weight: 700;
    }

    /* 下線インジケーター（デフォルトは非表示） */
    .tab-btn::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      border-radius: 999px;
      background: #9cad00;  /* LINEっぽい緑。黒にしたければ #111 とかに */
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.2s ease-out;
    }

    /* アクティブタブだけ下線を表示 */
    .tab-btn.active::after {
      transform: scaleX(1);
    }

    .page { padding: 8px; }
    /* モバイル用：一番下まで行っても、さらに少しスクロールできるようにする */
    @media (hover: none) and (pointer: coarse) {
      .page {
        padding-bottom: 30vh;  /* 画面の高さの約半分ぶん余白を追加（= グリッド2行分くらい） */
      }
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ========== グリッド ========== */
    .grid {
      display: grid;
      gap: 2px;
      grid-auto-flow: dense;
      grid-template-columns: repeat(3, 1fr);
    }

    /* タブレット以上 */
    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* PC以上 */
    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        
      }
    }

    /* ========== サイズ指定（aspect-ratio方式） ========== */

    /* 1×1（正方形） */
    .grid-item.square,
    .grid-item:not(.tall):not(.wide):not(.big) {
      aspect-ratio: 1 / 1;
    }

    /* 1×2（縦長） */
    .grid-item.tall {
      grid-row: span 2;
      aspect-ratio: 1 / 2;
    }

    /* 2×1（横長） */
    .grid-item.wide {
      grid-column: span 2;
      aspect-ratio: 2 / 1;
    }

    /* 2×2（大きい） */
    .grid-item.big {
      grid-column: span 2;
      grid-row: span 2;
      aspect-ratio: 2 / 2;
    }

    /* ========== 共通アイテム ========== */
    .grid-item {
      position: relative;
      overflow: hidden;
      background: #eee;
      cursor: pointer;
    }
    /* PC以上のときだけ角丸を適用 */
    @media (min-width: 1024px) {
      
      .grid-item {
        border-radius: 12px;
      }
      /* 縦長（1×2） → 本来の縦2倍 + gap補正 */
      .grid-item.tall {
        grid-row: span 2;
        aspect-ratio: 1 / calc(2 + (20px / 100%));
      }

      .grid-item.wide {
        grid-column: span 2;
        grid-row: span 1;
      }

      /* 2×2（big）→ gap2回分補正 */
      .grid-item.big {
        grid-column: span 2;
        grid-row: span 2;
        aspect-ratio: calc(2 + (20px / 100%)) / calc(2 + (20px / 100%));
      }
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease-out;
    }

    /* ホバー用のタイトルラベル */
    .grid-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 6px 8px;
      font-size: 12px;
      color: #fff;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.8),
        rgba(0, 0, 0, 0.0)
      );
      opacity: 0;
      transform: translateY(100%);
      pointer-events: none;
      transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    }
    @media (min-width: 1024px) {
      .grid-label {
        font-size: 18px;
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .grid-item:hover .grid-label {
        opacity: 1;
        transform: translateY(0);
      }

      /* ホバー中に画像をちょい拡大 */
      .grid-item:hover img {
        transform: scale(1.05);
      }
    }

    /* JSから付ける「ラベル見えてる状態」 */
    .grid-item.label-visible .grid-label {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== モーダル ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #000;
      color: #fff;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 820px;
      display: flex;
      flex-direction: column;
    }
    /* PCサイズのとき（1024px以上）はモーダルを大きく */
    @media (min-width: 1024px) {
      .modal {
        max-width: 1600px;
        max-height: 90vh;
      }
      .modal-image-wrap img {
        object-fit: contain;
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .modal-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      background: #000;
    }
    .modal-image-wrap img { width: 100%; display: block; }
    .modal-info {
      padding: 10px 12px 16px;
      background: #111;
    }
    .modal-meta {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
    }
    .modal-description {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* 画像下のタップで閉じるゾーン */
    .modal-tap-close-zone {
      height: 40px;
      background: transparent;
    }

    /* カルーセルボタン・ドット */
    .modal-image-wrap {
      position: relative;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0,0,0,0.4);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }

    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }

    .carousel-dot.active {
      background: #fff;
    }

    .footer {
      padding: 20px 12px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
    /* モバイル用：画面中央の帯カーソル */
    .mobile-focus-band {
      display: none; /* PCでは表示しない */
    }

    @media (hover: none) and (pointer: coarse) {
      .mobile-focus-band {
        display: block;
        position: fixed;
        left: 0;
        right: 0;
        /* 画面を縦に三等分して中央1/3を帯にするイメージ */
        top: 30%;
        height: 20%;
        pointer-events: none;          /* スクロールの邪魔をしない */
        z-index: 5;
        /* うっすら枠だけ見えるようにしたいなら↓を生かす */
        border-top: 1px dotted rgba(0,0,0,0.08);
        border-bottom: 1px dotted rgba(0,0,0,0.08);
      }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="app-title-wrap">
      <div class="app-title">D-VISUALS</div>
      <div class="app-subtitle">CGパース制作事例ギャラリー</div>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="mobile-focus-band" id="mobileFocusBand"></div>

<main class="page" id="panels"></main>

<main class="page" id="panels"></main>

<footer class="footer">
  <div>© 2025 問い合わせ / URL</div>
</footer>

<!-- 詳細ビュー -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-image-wrap" id="modalImageWrap">
        <img src="" alt="" id="modalImage">
        <!-- 画像切り替えボタン -->
        <button class="carousel-btn prev" id="modalPrev">&#10094;</button>
        <button class="carousel-btn next" id="modalNext">&#10095;</button>
        <!-- 丸ぽち -->
        <div class="carousel-dots" id="modalDots"></div>
      </div>

      <!-- ここをタップで閉じるゾーン -->
      <div class="modal-tap-close-zone" id="modalTapClose"></div>

      <div class="modal-info">
        <div class="modal-meta" id="modalMeta"></div>
        <div class="modal-description" id="modalDesc"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ▼ スプレッドシートTSV
  const SHEET_TSV_URL =
    "https://docs.google.com/spreadsheets/d/1rsHbHWmQDDoXfOwxllHl7YFvAkZeojIBLyzEISx7psQ/export?format=tsv&gid=651098947";

  let globalTabs = [];
  let currentTabIndex = 0;

  // モーダル用
  let currentImages = [];
  let currentImageIndex = 0;

  // === 1) シート読み込み（imageCount はあれば上限として使う） ===
  async function init() {
    const url = SHEET_TSV_URL + "&t=" + Date.now();
    const res = await fetch(url, { cache: "no-cache" });
    const text = await res.text();

    const rows = text
      .trim()
      .split(/\r?\n/)
      .map(r => r.split("\t").map(c => c.trim()));

    const header = rows.shift();
    const idx = {};
    header.forEach((name, i) => {
      idx[name.trim()] = i;
    });

    const tabsMap = {};

    rows.forEach(r => {
      const tabId    = r[idx["tabId"]];
      const tabLabel = r[idx["tabLabel"]];
      const title    = r[idx["title"]];
      const meta     = r[idx["meta"]];
      const desc     = r[idx["description"]];
      const size     = (r[idx["size"]] || "").trim();
      const status   = (r[idx["status"]] || "").trim();

      // imageCount 列（あれば上限として使う）
      let imageMax = 0;
      if (idx["imageCount"] != null) {
        const v = Number(r[idx["imageCount"]] || "");
        if (!Number.isNaN(v) && v > 0) imageMax = v;
      }

      if (status !== "公開" || !tabId) return;

      if (!tabsMap[tabId]) {
        tabsMap[tabId] = { id: tabId, label: tabLabel, items: [] };
      }

      tabsMap[tabId].items.push({
        title,
        meta,
        description: desc,
        size: size || "square",
        imageMax
      });
    });

    const tabArray = Object.values(tabsMap);

    // おすすめタブ = 全カテゴリのミックス
    const allItems = tabArray.flatMap(t => t.items);
    globalTabs = [
      { id: "recommend", label: "おすすめ", items: allItems },
      ...tabArray
    ];

    buildUI(globalTabs);
    setupModal();
    setupSwipe();
    setupMobileBandHover();
  }

  // === 2) タブ切り替え ===
  function activateTab(index) {
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabPanels  = document.querySelectorAll(".tab-panel");
    if (!tabButtons.length || !tabPanels.length) return;
    if (index < 0 || index >= tabButtons.length) return;

    currentTabIndex = index;

    tabButtons.forEach((btn, i) => {
      btn.classList.toggle("active", i === index);
    });
    tabPanels.forEach((panel, i) => {
      panel.classList.toggle("active", i === index);
    });

    const activeBtn = tabButtons[index];
    const tabsEl = document.getElementById("tabs");
    if (activeBtn && tabsEl) {
      const btnRect = activeBtn.getBoundingClientRect();
      const tabsRect = tabsEl.getBoundingClientRect();
      const offset =
        btnRect.left - tabsRect.left - (tabsRect.width / 2) + (btnRect.width / 2);
      tabsEl.scrollLeft += offset;
    }

    if (typeof window.__mobileBandUpdate === "function") {
      window.__mobileBandUpdate();
    }
  }

  // === 3) グリッド構築：サムネは meta-01.jpg だけ、lazy ロード ===
  function buildUI(tabs) {
    const tabsEl   = document.getElementById("tabs");
    const panelsEl = document.getElementById("panels");
    tabsEl.innerHTML = "";
    panelsEl.innerHTML = "";

    tabs.forEach((tab, index) => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (index === 0 ? " active" : "");
      btn.dataset.tab = tab.id;
      btn.dataset.index = index;
      btn.textContent = tab.label || tab.id;
      tabsEl.appendChild(btn);

      const section = document.createElement("section");
      section.className = "tab-panel" + (index === 0 ? " active" : "");
      section.id = tab.id;
      section.dataset.index = index;

      const grid = document.createElement("div");
      grid.className = "grid";

      tab.items.forEach(item => {
        const cell = document.createElement("div");

        let baseClass = "grid-item";
        if (item.size === "tall") {
          baseClass += " tall";
        } else if (item.size === "wide") {
          baseClass += " wide";
        } else if (item.size === "big") {
          baseClass += " big";
        } else {
          baseClass += " square";
        }
        cell.className = baseClass;

        cell.dataset.title       = item.title;
        cell.dataset.meta        = item.meta;
        cell.dataset.description = item.description;
        cell.dataset.imageMax    = String(item.imageMax || 0);

        const thumbUrl = item.meta ? `./images/${item.meta}-01.jpg` : "";
        if (thumbUrl) {
          const img = document.createElement("img");
          img.alt = item.title || "";
          img.loading = "lazy";   // 画面近くまで来るまで読まない
          img.src = thumbUrl;     // 01だけ
          cell.appendChild(img);
        }

        const label = document.createElement("div");
        label.className = "grid-label";
        label.textContent = item.title || "";
        cell.appendChild(label);

        grid.appendChild(cell);
      });

      section.appendChild(grid);
      panelsEl.appendChild(section);
    });

    const tabButtons = document.querySelectorAll(".tab-btn");
    tabButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.index || 0);
        activateTab(idx);
      });
    });

    currentTabIndex = 0;
  }

  // === 4) 拡大用：meta-01〜XX.jpg をその場で探す（クリックされた案件だけ） ===
  async function collectImages(meta, thumbUrl, imageMax) {
    const urls = [];

    // 01 は確実にあるので先に入れておく
    if (thumbUrl) urls.push(thumbUrl);

    // 何枚まで見るか：imageMax が 2以上ならそれ、なければ最大 10 まで
    const limit = imageMax && imageMax > 1 ? imageMax : 10;

    const promises = [];
    for (let i = 2; i <= limit; i++) {
      const num = String(i).padStart(2, "0");
      const url = `./images/${meta}-${num}.jpg`;

      promises.push(
        new Promise(resolve => {
          const img = new Image();
          img.onload = () => {
            urls.push(url); // あるものだけ追加
            resolve();
          };
          img.onerror = () => resolve();
          img.src = url;
        })
      );
    }

    await Promise.all(promises);
    return urls;
  }

  // === 5) モーダル処理（カルーセル + スワイプ） ===
  function setupModal() {
    const modalOverlay   = document.getElementById("modalOverlay");
    const modalImage     = document.getElementById("modalImage");
    const modalTitle     = document.getElementById("modalTitle");
    const modalMeta      = document.getElementById("modalMeta");
    const modalDesc      = document.getElementById("modalDesc");
    const modalClose     = document.getElementById("modalClose");
    const modalPrev      = document.getElementById("modalPrev");
    const modalNext      = document.getElementById("modalNext");
    const modalDots      = document.getElementById("modalDots");
    const modalImageWrap = document.getElementById("modalImageWrap");
    const modalTapClose  = document.getElementById("modalTapClose");
    const modalBody      = document.querySelector(".modal-body");

    function renderModalImage() {
      if (!currentImages.length) {
        modalImage.src = "";
        modalDots.innerHTML = "";
        return;
      }
      if (currentImageIndex < 0) currentImageIndex = 0;
      if (currentImageIndex >= currentImages.length) currentImageIndex = currentImages.length - 1;

      modalImage.src = currentImages[currentImageIndex];

      modalDots.innerHTML = "";
      currentImages.forEach((_, idx) => {
        const dot = document.createElement("div");
        dot.className = "carousel-dot" + (idx === currentImageIndex ? " active" : "");
        dot.addEventListener("click", () => {
          currentImageIndex = idx;
          renderModalImage();
        });
        modalDots.appendChild(dot);
      });

      const showNav = currentImages.length > 1;
      modalPrev.style.display = showNav ? "flex" : "none";
      modalNext.style.display = showNav ? "flex" : "none";
      modalDots.style.display = showNav ? "flex" : "none";
    }

    // ★ グリッドクリック → 画像枚数をその場で探索してからモーダル表示
    document.body.addEventListener("click", async (e) => {
      const cell = e.target.closest(".grid-item");
      if (!cell) return;

      const meta     = cell.dataset.meta;
      const imageMax = Number(cell.dataset.imageMax || "0");
      const thumbImg = cell.querySelector("img");
      const thumbUrl = thumbImg ? thumbImg.src : "";

      let imgs = [];
      if (meta) {
        imgs = await collectImages(meta, thumbUrl, imageMax);
      }
      if (!imgs.length && thumbUrl) {
        imgs = [thumbUrl];
      }

      currentImages = imgs;
      currentImageIndex = 0;

      modalTitle.textContent = cell.dataset.title || "";
      modalMeta.textContent  = meta || "";
      modalDesc.textContent  = cell.dataset.description || "";

      renderModalImage();
      modalOverlay.classList.add("show");
    });

    modalClose.addEventListener("click", () => {
      modalOverlay.classList.remove("show");
    });
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove("show");
      }
    });
    if (modalTapClose) {
      modalTapClose.addEventListener("click", () => {
        modalOverlay.classList.remove("show");
      });
    }

    modalPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!currentImages.length) return;
      currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
      renderModalImage();
    });
    modalNext.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!currentImages.length) return;
      currentImageIndex = (currentImageIndex + 1) % currentImages.length;
      renderModalImage();
    });

    // モーダル内画像の横スワイプで切り替え
    let startX = 0, startY = 0, endX = 0, endY = 0;
    const SWIPE_X = 40;

    modalImageWrap.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      endX = startX;
      endY = startY;
    });
    modalImageWrap.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      endX = t.clientX;
      endY = t.clientY;
    });
    modalImageWrap.addEventListener("touchend", () => {
      const dx = endX - startX;
      const dy = endY - startY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_X) {
        if (!currentImages.length) return;
        if (dx < 0) {
          currentImageIndex = (currentImageIndex + 1) % currentImages.length;
        } else {
          currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
        }
        renderModalImage();
      }
    });

    // モバイル：下半分の縦スワイプで閉じる
    if (modalBody) {
      let closeStartX = 0, closeStartY = 0, closeEndX = 0, closeEndY = 0;
      let closeActive = false;
      const CLOSE_SWIPE_Y = 60;

      modalBody.addEventListener("touchstart", (e) => {
        const t = e.touches[0];
        closeStartX = t.clientX;
        closeStartY = t.clientY;
        closeEndX = closeStartX;
        closeEndY = closeStartY;
        const vhMid = window.innerHeight / 2;
        closeActive = (closeStartY > vhMid);
      });
      modalBody.addEventListener("touchmove", (e) => {
        const t = e.touches[0];
        closeEndX = t.clientX;
        closeEndY = t.clientY;
      });
      modalBody.addEventListener("touchend", () => {
        if (!closeActive) return;
        const dx = closeEndX - closeStartX;
        const dy = closeEndY - closeStartY;
        if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > CLOSE_SWIPE_Y) {
          modalOverlay.classList.remove("show");
        }
      });
    }
  }

  // === 6) モバイル：左右スワイプでタブ切り替え ===
  function setupSwipe() {
    const panels = document.getElementById("panels");
    if (!panels) return;

    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
    const SWIPE_THRESHOLD = 50;

    panels.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchEndX = touchStartX;
      touchEndY = touchStartY;
    });
    panels.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      touchEndX = t.clientX;
      touchEndY = t.clientY;
    });
    panels.addEventListener("touchend", () => {
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;
      if (Math.abs(dy) > Math.abs(dx)) return;
      if (Math.abs(dx) < SWIPE_THRESHOLD) return;

      if (dx < 0) {
        const next = currentTabIndex + 1;
        if (next < globalTabs.length) activateTab(next);
      } else {
        const prev = currentTabIndex - 1;
        if (prev >= 0) activateTab(prev);
      }
    });
  }

  // === 7) モバイル中央帯ホバー（タイトル表示） ===
  function setupMobileBandHover() {
    const band = document.getElementById("mobileFocusBand");
    if (!band) return;

    const isTouchDevice = window.matchMedia(
      "(hover: none) and (pointer: coarse)"
    ).matches;
    if (!isTouchDevice) return;

    const update = () => {
      const activePanel = document.querySelector(".tab-panel.active");
      if (!activePanel) return;
      const items = Array.from(activePanel.querySelectorAll(".grid-item"));
      if (!items.length) return;

      const bandRect   = band.getBoundingClientRect();
      const bandTop    = bandRect.top;
      const bandBottom = bandRect.bottom;

      document
        .querySelectorAll(".grid-item.label-visible")
        .forEach(el => el.classList.remove("label-visible"));

      items.forEach(item => {
        const rect = item.getBoundingClientRect();
        if (rect.bottom < 0 || rect.top > window.innerHeight) return;
        const overlaps = !(rect.bottom <= bandTop || rect.top >= bandBottom);
        if (overlaps) item.classList.add("label-visible");
      });
    };

    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    window.__mobileBandUpdate = update;
    setTimeout(update, 100);
  }

  init();
</script>
